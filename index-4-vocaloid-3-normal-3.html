*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff8fb;color:#172033}

.product{background:white;border:1px solid #eee;border-radius:18px;overflow:hidden;box-shadow:0 8px 20px #0001}

eUtn7JGc/M0It5oO0qqT/CwqU3bbf5kYPLCc/vpUx2T/AECHxY+iiuqBbliMrPkfy11FMD//2Q==",t:"AurenT Özel Seri"}];
let C={};try{C=JSON.parse(localStorage.getItem("atcart")||"{}")}catch(e){}
let G={};try{G=JSON.parse(localStorage.getItem("atgifts")||"{}")}catch(e){}
const PROMO_CODE="V0C-7Q4-91LX";
const DISCOUNT_CODE="AUR2026";
let discountActive=localStorage.getItem("atDiscountPromo")==="1";
const GIFT_IDS=["miku","teto","neru","gumi"];
const money=x=>x.toLocaleString("tr-TR",{minimumFractionDigits:2})+" TL";
function card(p){return `<article class="card"><img src="${p.img}"><div class="body">${p.id==="gumi"?'<span class="new">✨ YENİ</span>':""}${p.id==="teto"?'<span class="best">🔥 ÇOK SATAN</span>':""}<small>${p.t}</small><h2>${p.n}</h2><div class="row"><b class="price">${money(p.p)}</b><button class="add" onclick="add('${p.id}')">Sepete Ekle</button></div></div></article>`}
function normal(p){return `<article class="product"><img src="${p.img}"><div class="body"><small>${p.t}</small><h2>${p.n}</h2><div class="row"><b class="price">${money(p.p)}</b><button class="add" onclick="add('${p.id}')">Sepete Ekle</button></div></div></article>`}
document.getElementById("vocaloid").innerHTML=P.slice(0,4).map(card).join("");
document.getElementById("normal").innerHTML=P.slice(4).map(normal).join("");
function add(id){C[id]=(C[id]||0)+1;save();render()}
function save(){localStorage.setItem("atcart",JSON.stringify(C));localStorage.setItem("atgifts",JSON.stringify(G))}
function render(){let n=0,t=0,h="";for(const id in C){let p=P.find(x=>x.id===id),q=C[id];if(!p)continue;n+=q;t+=p.p*q;h+=`<div class="item"><img src="${p.img}"><div><b>${p.n}</b><br>${money(p.p)} × ${q}<br><button onclick="chg('${id}',-1)">−</button> <button onclick="chg('${id}',1)">+</button></div></div>`}
for(const id in G){let p=P.find(x=>x.id===id),q=G[id];if(!p||q<=0)continue;n+=q;h+=`<div class="item"><img src="${p.img}"><div><b>🎁 ${p.n}</b><br><strong>ÜCRETSİZ</strong> × ${q}<br><button onclick="removeGift('${id}')">Kaldır</button></div></div>`}
const discountedTotal=discountActive?t*0.9:t;
if(discountActive && t>0){h+=`<div style="margin-top:12px;padding:10px;border-radius:10px;background:#eef8f1;color:#16834b;font-weight:800">🏷️ AUR2026: %10 indirim uygulandı</div>`;}
document.getElementById("count").textContent=n;document.getElementById("total").textContent=money(discountedTotal);document.getElementById("cart").innerHTML=h||"Sepet boş."}
function removeGift(id){delete G[id];save();render()}
function applyPromo(){const input=document.getElementById("promoInput"),msg=document.getElementById("promoMsg");const code=input.value.trim().toUpperCase();
if(code===DISCOUNT_CODE){if(discountActive){msg.textContent="⚠️ AUR2026 indirimi zaten aktif.";msg.style.color="#b26a00";return}discountActive=true;localStorage.setItem("atDiscountPromo","1");save();render();msg.textContent="🎉 AUR2026 aktif! Sepetinizde %10 indirim uygulandı.";msg.style.color="#16834b";input.value="";return}
if(code!==PROMO_CODE){msg.textContent="❌ Geçersiz promosyon kodu.";msg.style.color="#c52e68";return}if(localStorage.getItem("atPromoUsed")==="1"){msg.textContent="⚠️ Bu promosyon kodu daha önce kullanıldı.";msg.style.color="#b26a00";return}for(const id of GIFT_IDS){G[id]=(G[id]||0)+1}localStorage.setItem("atPromoUsed","1");save();render();msg.textContent="🎉 Tebrikler! Miku, Teto, Neru ve Gumi sütleri ücretsiz olarak sepete eklendi.";msg.style.color="#16834b";input.value=""}
function chg(id,x){C[id]=(C[id]||0)+x;if(C[id]<=0)delete C[id];save();render()}
function openCart(){document.getElementById("drawer").classList.add("open");render()}function closeCart(){document.getElementById("drawer").classList.remove("open")}
function satinAl(){if(Object.keys(C).length===0 && Object.keys(G).length===0){alert("🛒 Sepetiniz boş!");return}alert("✅ Siparişiniz alınmıştır!\n\nAurenT'yi tercih ettiğiniz için teşekkürler! 💙");C={};G={};discountActive=false;localStorage.removeItem("atDiscountPromo");save();render();closeCart()}
render();

function filterProducts(){
  const q=document.getElementById("searchInput").value.trim().toLocaleLowerCase("tr-TR");
  const result=document.getElementById("searchResult");

  if(!q){
    document.getElementById("vocaloid").innerHTML=P.slice(0,4).map(card).join("");
    document.getElementById("normal").innerHTML=P.slice(4).map(normal).join("");
    result.textContent="";
    return;
  }

  const matches=P.filter(p=>p.n.toLocaleLowerCase("tr-TR").includes(q));
  document.getElementById("vocaloid").innerHTML=P.filter((p,i)=>i<4 && p.n.toLocaleLowerCase("tr-TR").includes(q)).map(card).join("");
  document.getElementById("normal").innerHTML=P.filter((p,i)=>i>=4 && p.n.toLocaleLowerCase("tr-TR").includes(q)).map(normal).join("");
  result.textContent=matches.length ? matches.length+" ürün bulundu." : "Ürün bulunamadı.";
}

document.getElementById("searchInput").addEventListener("input",filterProducts);
</script></body></html>
